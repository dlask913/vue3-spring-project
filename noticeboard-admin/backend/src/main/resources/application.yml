server:
  port: 8081

spring:
  config:
    import:
      - "optional:file:${LOCAL_SECRETS_FILE:../.env.local}[.properties]"
  application:
    name: noticeboard-admin
  # PostgreSQL DataSource
  datasource:
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    url: jdbc:log4jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:noticeboard}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  # caffeine cache 설정
  cache:
    type: caffeine
  caffeine:
    spec: maximumSize=500,expireAfterWrite=5m
  data:
    redis:
      host: localhost
      port: 6379
  thymeleaf:
    encoding: UTF-8
    mode: HTML
    cache: false
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD:}
    property:
      prefix: "ENC("
      suffix: ")"

# Mapper Xml Location
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.limnj.noticeboardadmin
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}

# 파일 경로 설정
uploadPath: file:///C:/files/
defaultImgPath: classpath:/static/default-image/
categoryImgLocation: C:/images/category
fileLocation: C:/images/files

AUTH_EMAIL_SUBJECT: "[인증코드 발송]"
AUTH_EMAIL_TEMPLATE: "templates/email/sendAuthentication.html"

httponly-secure-option: false
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    url: jdbc:log4jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_TEST_DB:testboard}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
