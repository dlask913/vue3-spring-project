name: Deploy Noticeboard Admin Frontend
on:
  push:
    branches: [main]
    paths:
      - 'noticeboard-admin/frontend/**'
      - '.github/workflows/deploy-admin-fe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admin-frontend-production
  cancel-in-progress: false
jobs:
  deploy-frontend:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
    defaults:
      run:
        working-directory: noticeboard-admin/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ACCOUNT_ID AWS_S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: noticeboard-admin/frontend/package-lock.json
      - name: Install and build SPA
        run: |
          npm ci
          npm run build
          test -f dist/spa/index.html
      - name: Assume AWS deployment role with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-admin-${{ github.run_id }}
          role-duration-seconds: 900
      # Keep old hashed assets for already-open clients; publish index last.
      - name: Upload files and publish index
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync dist/spa/ "s3://$AWS_S3_BUCKET/" \
            --exclude 'index.html' --cache-control 'public,max-age=300' --only-show-errors
          aws s3 cp dist/spa/index.html "s3://$AWS_S3_BUCKET/index.html" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'text/html; charset=utf-8' --only-show-errors
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths '/*'
