version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres-app
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noticeboard}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgresql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432" # 기본 포트
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend


  spring-app-1:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: spring-app-1
    working_dir: /app
    volumes:
      - app_images:/app/images
      - ./logs/spring-app:/app/logs  # 로그 디렉토리 추가
    environment:
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-noticeboard}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypass}
      # JWT_SECRET: "${JWT_SECRET}"
      # KAKAO_API_KEY: "${KAKAO_API_KEY}"
      # MAIL_USERNAME: "${MAIL_USERNAME}"
      # MAIL_PASSWORD: "${MAIL_PASSWORD}"
      # SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL}"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  spring-app-2:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: spring-app-2
    working_dir: /app
    volumes:
      - app_images:/app/images
      - ./logs/spring-app:/app/logs  # 로그 디렉토리 추가
    environment:
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-noticeboard}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypass}
      # JWT_SECRET: "${JWT_SECRET}"
      # KAKAO_API_KEY: "${KAKAO_API_KEY}"
      # MAIL_USERNAME: "${MAIL_USERNAME}"
      # MAIL_PASSWORD: "${MAIL_PASSWORD}"
      # SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL}"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
  
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: nginx-app
    depends_on:
      - spring-app-1
      - spring-app-2
    ports:
      - "80:80"
      - "443:443"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data: # 데이터 저장
  app_images: # 이미지 저장
