spring:
  config:
    import:
      - "optional:file:${LOCAL_SECRETS_FILE:../.env.local}[.properties]"
  application:
    name: noticeboard-service
  profiles:
    active: local
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  output:
    ansi:
      enabled: always

logging:
  file:
    encoding: UTF-8

# Mapper Xml Location
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.noticeboardservice.dto # Dto 매핑 클래스 패키지 지정
  configuration:
    map-underscore-to-camel-case: true

# 카카오 REST API KEY
kakao-rest-api-key: ${KAKAO_API_KEY}

jwt:
  secret: ${JWT_SECRET}

slack:
  webhook:
    url: ${SLACK_WEBHOOK_URL}

# JASYPT Encryptor
jasypt:
  encryptor:
    bean: jasyptStringEncryptor
    property:
      prefix: "ENC("
      suffix: ")"

google:
  recaptcha:
    secret-key: ${RECAPTCHA_SECRET_KEY}
