spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:log4jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:noticeboard}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy

management:
  server:
    port: 9292
  endpoints:
    web:
      exposure:
        include: health,info,metrics,threaddump,heapdump,httptrace,loggers,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      all: true
    distribution:
      percentiles-histogram:
        http.server.requests: true      # <-- latency bucket 생성
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99

upload-path: file:///C:/images/
default-img-path: classpath:/static/default-image/
member-img-location: C:/images/member
product-img-location: C:/images/product
category-img-location: C:/images/category
httponly-secure-option: false
