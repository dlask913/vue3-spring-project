spring:
  profiles:
    active: test
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:postgresql:15:///testboard_${random.uuid}
    username: test
    password: test
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-postgresql.sql
      separator: "^^^ END OF SCRIPT ^^^"
  mail:
    host: localhost
    port: 2525

#MyBatis
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.noticeboardservice.dto # Dto 매핑 클래스 패키지 지정
  configuration:
    map-underscore-to-camel-case: true

upload-path: file:./build/test-images/
default-img-path: classpath:/static/default-image/
member-img-location: ./build/test-images/member
product-img-location: ./build/test-images/product
category-img-location: ./build/test-images/category

httponly-secure-option: false
google:
  recaptcha:
    secret-key: test-only

